<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>COMP3008 A4 Implementation</title>
        <link rel="stylesheet" href="styles.css">
        <script src="data.js"></script>
        <script src="app.js" defer></script>
    </head>

    <body>
        <header>
            <img src="../images/Flag_of_Canada.webp" width="160" height="80" alt="Canada Flag">
            <p>Government of Canada<br>Gouvernement du Canada</p>
            
            <h1>Find A Service Canada Office</h1>
        </header>

        <!-- dropdowns get dynamically populated -->
        <main>

            <ul id="upper-main">
                <li id="first">
                    <a href="https://www.canada.ca/en.html" target="_self">canada.ca</a> <span>></span> dashboard
                </li>
                <li>
                    <p>Outside Canada?</p>
                    <a href="https://travel.gc.ca/assistance/embassies-consulates" target="none">View Embassies</a>
                </li>
            </ul>

            <!-- all dropdowns will be dynamically populated -->
            <ul id="dropdowns">
                <li>
                    <select id="service" aria-label="Service type">
                        <option value>-Select a service-</option>
                    </select>
                </li>
                <li>
                    <select id="delivery" aria-label="Service completion time">
                        <option value>-Select a service completion time-</option>
                    </select>
                </li>
                <li>
                    <select id="location" aria-label="City or current location">
                        <option value>-Select a city-</option>
                    </select>
                </li>
                <li id="filter-actions">
                    <button type="button" id="clear-filters">
                        Clear Filters
                    </button>
                </li>
            </ul>

            <div id="content">
                <h2>Select a service and location to view offices</h2>
                <!-- will be dynamically populated with <li>s -->
                <ul id="location-data">

                </ul>
                <p id="search-status" role="status" aria-live="polite"></p>
            </div>

        </main>

        <footer>
            <div id="other">
                <p>Terms and conditions  ·  Privacy policy</p>
            </div>
            <div id="img-div">
                <img src="../images/gov-canada-text.png" width="150" height="45" alt="Canada Flag">
            </div>
        </footer>
    </body>
</html>
