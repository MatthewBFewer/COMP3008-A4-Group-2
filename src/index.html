<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>COMP3008 A4 Implementation</title>
        <link rel="stylesheet" href="styles.css">
        <!-- <script src="data.js"></script> (will uncomment this upon adding locations data) -->
        <script src="app.js" defer></script>
    </head>

    <body>
        <header>
            <img src="../images/Flag_of_Canada.webp" width="160" height="80" alt="Canada Flag">
            <p>Government of Canada<br>Gouvernement du Canada</p>
            
            <h1>Find A Service Canada Office</h1>
        </header>

        <!-- dropdowns get dynamically populated -->
        <main>

            <ul id="upper-main">
                <li id="first">
                    <p>canada.ca <span>></span> dashboard</p>
                </li>
                <li>
                    <p>Outside Canada?</p>
                    <a href="https://travel.gc.ca/assistance/embassies-consulates" target="none">View Embassies</a>
                </li>
            </ul>

            <ul id="dropdowns">
                <li>
                    <select id="service">
                        <option value>-Select a service-</option>
                    </select>
                </li>
                <li>
                    <select id="delivery">
                        <option value>-Select a service completion time-</option>
                    </select>
                </li>
                <li>
                    <select id="location">
                        <option value>-Select a city-</option>
                    </select>
                </li>
            </ul>

        </main>

        <footer>
            <p>footer</p>
        </footer>
    </body>
